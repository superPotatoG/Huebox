[/Script/Engine.RendererSettings]
; Huebox (10-30): the stage is unlit silhouettes + a few lit tiles, so the template's high-end features are off -
; measured on the packaged build: committed memory 3.9 -> 2.0 GB, GPU memory 2.2 -> 0.7 GB, same look.
; Reflections: screen space (was Lumen). GI: none (was Lumen). Distance fields: only Lumen used them.
r.ReflectionMethod=2
r.GenerateMeshDistanceFields=False
r.DynamicGlobalIlluminationMethod=0
r.Lumen.TraceMeshSDFs=0
; Regular shadow maps (was virtual shadow maps).
r.Shadow.Virtual.Enable=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=true
r.AllowStaticLighting=False

r.SkinCache.CompileShaders=True

; Hardware ray tracing off (nothing uses it; it costs acceleration-structure memory and cooked RT data).
r.RayTracing=False

r.RayTracing.RayTracingProxies.ProjectEnabled=False

r.Substrate=True

r.Substrate.ProjectGBufferFormat=0

r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8

r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

